<!DOCTYPE html>
<html>
  <head>
    <title>8e problem</title>
  </head>
  <body>
    <script>
      function isSameProduct(product1, product2) {
        if (
          product1.name === product2.name &&
          product1.price === product2.price
        ) {
          return true;
        } else {
          return false;
        }
      }

      const product1 = {
        name: 'Bat',
        price: 2000
      };

      const product2 = {
        name: 'Ball',
        price: 1101
      };

      const product3 = {
        name: 'Stump',
        price: 3214
      };

      console.log(isSameProduct(product1, product2));
      console.log(isSameProduct(product1, product3));
    </script>
  </body>
</html>
