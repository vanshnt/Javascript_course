<!DOCTYPE html>
<html>
  <head>
    <title>8d problem</title>
  </head>
  <body>
    <script>
      function comparePrice(product1, product2) {
        if (product1.price < product2.price) {
          return product1;
        } else {
          return product2;
        }
      }

      const product1 = {
        name: 'Bat',
        price: 2000
      };

      const product2 = {
        name: 'Ball',
        price: 1101
      };

      console.log(comparePrice(product1, product2));
    </script>
  </body>
</html>
