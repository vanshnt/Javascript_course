<!DOCTYPE html>
<html>
  <head></head>
  <body>
    <input placeholder="Name" class="name"
      onkeydown="
        if (event.key === 'Enter') {
          displayMessage();
        }
      ">

    <button onclick="
      displayMessage();
    ">Submit</button>

    <p class="message"></p>

    <script>
      function displayMessage() {
        const inputElement = document.querySelector('.name');
        document.querySelector('.message')
          .innerHTML = `Your name is: ${inputElement.value}`;
      }
    </script>
  </body>
</html>
