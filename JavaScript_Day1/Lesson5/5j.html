<!DOCTYPE html>
<html>

<head>
    <title>5h problem</title>
</head>

<body>
    <button onclick="
            console.log(`Cart quantity :${cartquantity}`)
            ">Show Quantity
    </button>

    <button onclick="
            cartquantity += 1
        ">Add to cart
    </button>

    <button onclick="
        cartquantity +=2
        ">+2
    </button>

    <button onclick="
        cartquantity += 3
        ">+3
    </button>
    <button onclick="
        cartquantity += 4
        ">+4
    </button>

    <button onclick="
        cartquantity += 5
        ">+5
    </button>

    <button onclick="
        cartquantity -= 1
        ">Remove From the cart
    </button>

    <button onclick="
        cartquantity -=2
        ">-2
    </button>
    <button onclick="
        cartquantity -=3
        ">-3
    </button>
    <button onclick="cartquantity = 0">Reset cart</button>

    <script>
        let cartquantity = 0;

    </script>
</body>

</html>
