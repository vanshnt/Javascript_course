<!DOCTYPE html>
<html>
    <head>
        <title>Buttons</title>
        <style>
            .addtocart{
                background-color: yellow;
                
            }
            .buynow{
                background-color: orange;
                
            }
        </style>
    </head>
    <body>
        <p>Adults plain cotton T-shirts</p>
        <p>Price: $7.99</p>
        <button class="addtocart" onclick="alert('Added')">Add to cart</button>
        <button class="buynow" onclick="console.log('Loading...'), alert('Purchased')">Buy now</button>
    </body>
</html>
