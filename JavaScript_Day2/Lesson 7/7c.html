<!DOCTYPE html>
<html>

        <title>7c Problem</title>

    <body>
        <script>
           function greet(name){
            if(!name){
                console.log("Hello there!")
            }
            else{

                console.log(`Hello! ${name}`);
            }
           }
           greet("Vansh");
           greet("Nikhil");
           greet();
        </script>
    </body>
