<!DOCTYPE html>
<html>

<head>
    <title>5th problem</title>
</head>

<body>
    <button onclick="
            console.log(`Cart quantity :${cartquantity}`)
            ">Show Quantity
    </button>

    <button onclick="
            if (cartquantity +1 > 10) {
                alert('The Cart is Full')
            }
            else{
                cartquantity += 1
                console.log(`Cart quantity :${cartquantity}`)
            }
            
        ">Add to cart
    </button>

    <button onclick="
        if (cartquantity +2 > 10) {
                alert('The Cart is Full')
            }
            else{
                cartquantity += 2
                console.log(`Cart quantity :${cartquantity}`)
            }
        ">+2
    </button>

    <button onclick="
        if (cartquantity +3 > 10) {
                alert('The Cart is Full')
            }
            else{
                cartquantity += 3
                console.log(`Cart quantity :${cartquantity}`)
            }
        ">+3
    </button>
    <button onclick="
        if (cartquantity +4 > 10) {
                alert('The Cart is Full')
            }
            else{
                cartquantity += 4
                console.log(`Cart quantity :${cartquantity}`)
            }
        ">+4
    </button>

    <button onclick="
        if (cartquantity +5 > 10) {
                alert('The Cart is Full')
            }
            else{
                cartquantity += 5
                console.log(`Cart quantity :${cartquantity}`)
            }
        ">+5
    </button>

    <button onclick="
        if (cartquantity -1 < 0) {
            alert('Not Enough items in the cart')
        }
        else{
            cartquantity -= 1
            console.log(`Cart quantity :${cartquantity}`)
        }
        
        ">Remove From the cart
    </button>

    <button onclick="
       if (cartquantity -2 < 0) {
            alert('Not Enough items in the cart')
        }
        else{
            cartquantity -= 2
            console.log(`Cart quantity :${cartquantity}`)
        } 
        ">-2
    </button>
    <button onclick="
        if (cartquantity -3 < 0) {
            alert('Not Enough items in the cart')
        }
        else{
            cartquantity -= 3
            console.log(`Cart quantity :${cartquantity}`)
        }
        ">-3
    </button>
    <button onclick="cartquantity = 0">Reset cart</button>

    <script>
        let cartquantity = 0;

    </script>
</body>

</html>
